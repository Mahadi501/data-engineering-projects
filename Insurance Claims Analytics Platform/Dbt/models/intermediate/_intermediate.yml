        data_tests:
          - not_null
          - relationships:
             arguments: 
              to: ref('stg_claims')
              field: claim_id
  - name: int_payment_details
    columns:
      - name: PAYMENT_ID
        data_tests:
         - not_null
         - relationships:
            arguments: 
             to: ref('stg_payments')
             field: PAYMENT_ID
      - name: claim_id
